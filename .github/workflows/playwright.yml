name: Playwright Tests (Robot Utilisateur Cloud)
on:
  push:
    branches-ignore:
      - main # Évite de faire tourner les tests en double sur la branche de production directe

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci || npm install

    # Le téléchargement du navigateur est le point fragile de ce workflow : il
    # s'est déjà figé une heure entière, consommant tout le budget du job avant
    # même le build (run 32276118646). Le cache évite le téléchargement dans le
    # cas courant, et le délai d'attente fait échouer vite au lieu de bloquer.
    # Aucune donnée d'événement n'entre ici : la clé ne dépend que de l'OS du
    # runner et du verrou de dépendances.
    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: playwright-${{ runner.os }}-

    - name: Install Playwright Browsers
      timeout-minutes: 10
      run: npx playwright install --with-deps chromium

    # L'app tourne en MODE DÉMO (données mock) quand Supabase n'est pas
    # configuré : on NE passe AUCUNE variable Supabase, sinon l'app croit
    # Supabase actif et les appels (ex. /api/connectors) échouent contre une
    # URL invalide. Cohérent avec le workflow e2e.yml (qui passe).
    - name: Build Next.js Application
      run: npm run build

    - name: Run Playwright tests
      run: npx playwright test
      env:
        E2E_BYPASS_SECRET: ci-e2e-secret
        CI: "true"

    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
