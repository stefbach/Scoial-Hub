<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AXON-AI — Hors ligne</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0614;
        color: #f4f1fb;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card { max-width: 360px; }
      .logo {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        border-radius: 14px;
        background: linear-gradient(135deg, #a684ff, #5b2d8e);
      }
      h1 { font-size: 1.15rem; margin: 0 0 8px; }
      p { font-size: 0.9rem; color: #b9b1cf; margin: 0 0 20px; line-height: 1.5; }
      button {
        border: none;
        border-radius: 10px;
        padding: 10px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #fff;
        background: #5b2d8e;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo"></div>
      <h1>Connexion indisponible</h1>
      <p>AXON-AI a besoin d'une connexion internet pour piloter vos campagnes. Reconnectez-vous puis réessayez.</p>
      <button onclick="location.reload()">Réessayer</button>
    </div>
  </body>
</html>
